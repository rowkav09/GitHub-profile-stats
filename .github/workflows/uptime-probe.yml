name: Uptime probe

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Record service availability
        run: curl --fail --silent --show-error --retry 2 https://ghstats.dev/api/status > /dev/null
